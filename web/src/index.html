<title>Clause Check 编程营</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/runmode/runmode.min.js"></script>
<script src="harness.js"></script>
<script src="course.js"></script>
<style>
/*CODEMIRROR_CSS*/
:root {
  --ground: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #15202b;
  --muted: #5b6977;
  --faint: #8894a0;
  --line: #d8dee5;
  --accent: #2447a6;
  --accent-ink: #ffffff;
  --accent-soft: #e5ebf9;
  --pass: #2c7a4b;
  --pass-soft: #e3f2e8;
  --fail: #c0392e;
  --fail-soft: #fbe9e7;
  --warn: #9a6512;
  --warn-soft: #fbf1dc;
  --code-bg: #f7f8fa;
  --cm-keyword: #7a3eb1;
  --cm-string: #22784a;
  --cm-number: #b3531b;
  --cm-comment: #7b8794;
  --cm-def: #2447a6;
  --cm-builtin: #0f6f7a;
  --shadow: 0 1px 2px rgba(21, 32, 43, 0.06), 0 4px 16px rgba(21, 32, 43, 0.06);
  --font-ui: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, "Microsoft YaHei Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0e1318; --surface: #161d25; --surface-2: #1b232d; --ink: #e4e9ee; --muted: #9aa7b4; --faint: #6c7a88;
    --line: #28323d; --accent: #7e9cf1; --accent-ink: #0e1318; --accent-soft: #1c2944; --pass: #6fca8d; --pass-soft: #16301f;
    --fail: #f1786c; --fail-soft: #3a1b18; --warn: #e2b35a; --warn-soft: #33270f; --code-bg: #11171e;
    --cm-keyword: #c59af2; --cm-string: #83d19f; --cm-number: #f0a36e; --cm-comment: #74828f; --cm-def: #8fb0ff; --cm-builtin: #62c4cf;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e1318; --surface: #161d25; --surface-2: #1b232d; --ink: #e4e9ee; --muted: #9aa7b4; --faint: #6c7a88;
  --line: #28323d; --accent: #7e9cf1; --accent-ink: #0e1318; --accent-soft: #1c2944; --pass: #6fca8d; --pass-soft: #16301f;
  --fail: #f1786c; --fail-soft: #3a1b18; --warn: #e2b35a; --warn-soft: #33270f; --code-bg: #11171e;
  --cm-keyword: #c59af2; --cm-string: #83d19f; --cm-number: #f0a36e; --cm-comment: #74828f; --cm-def: #8fb0ff; --cm-builtin: #62c4cf;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font: 15px/1.6 var(--font-ui); }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre, .mono { font-family: var(--font-code); font-size: 13px; }
p code, li code, .md code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; white-space: break-spaces; overflow-wrap: anywhere; }

/* ---------- shell ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { font: 700 18px/1.2 var(--font-head); letter-spacing: 0.01em; display: flex; align-items: baseline; gap: 10px; }
.brand small { font: 500 12px var(--font-ui); color: var(--muted); letter-spacing: 0; }
.meter { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.meter .bar { width: 140px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); }
.meter b { color: var(--ink); font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.chip.ok .dot { background: var(--pass); } .chip.busy .dot { background: var(--warn); } .chip.bad .dot { background: var(--fail); }
.chip label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; padding-block: 20px 40px; padding-inline: 20px; max-width: 1440px; margin: 0 auto; }
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 68px); align-self: start; max-height: calc(100vh - 88px); overflow-y: auto; }
.rail h4 { font: 600 11px var(--font-head); text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin: 12px 8px 4px; }
.weekBtn { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: none; }
.weekBtn:hover { background: var(--surface); }
.weekBtn .wt { font: 600 12px var(--font-head); letter-spacing: 0.06em; color: var(--muted); }
.weekBtn .wt::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--faint); }
.weekBtn[aria-expanded="true"] .wt { color: var(--accent); }
.weekBtn[aria-expanded="true"] .wt::before { content: "▾"; color: var(--accent); }
.weekBtn .wp { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.weekBtn .bar { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.weekBtn .bar i { display: block; height: 100%; background: var(--pass); }
.dayBtn { display: grid; grid-template-columns: 34px 1fr; gap: 2px 10px; align-items: center; text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: none; }
.dayBtn:hover { background: var(--surface); }
.dayBtn[aria-current="true"] { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
.dayBtn .num { grid-row: span 2; font: 700 22px/1 var(--font-head); color: var(--faint); text-align: center; }
.dayBtn[aria-current="true"] .num { color: var(--accent); }
.dayBtn .t { font-size: 13px; line-height: 1.3; font-weight: 500; }
.dayBtn .p { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.dayBtn .p .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.dayBtn .p .bar i { display: block; height: 100%; background: var(--pass); }
.navBtn { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 8px; border: 1px solid transparent; background: none; font-size: 14px; }
.navBtn:hover { background: var(--surface); }
.navBtn[aria-current="true"] { background: var(--surface); border-color: var(--line); }
.badge { font-size: 11px; font-weight: 600; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); text-align: center; }

main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.dayHead { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px 32px; }
.eyebrow { font: 600 12px var(--font-head); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.dayHead h1 { font: 700 26px/1.2 var(--font-head); margin: 4px 0 8px; text-wrap: balance; }
.dayHead p { margin: 0; color: var(--muted); max-width: 62ch; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.checklist label { display: grid; grid-template-columns: 18px 1fr; gap: 8px; cursor: pointer; align-items: start; }
.checklist input { margin-top: 3px; accent-color: var(--accent); }
.checklist .done span { color: var(--faint); text-decoration: line-through; }

.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; align-self: flex-start; }
.tabs button { border: 0; background: none; padding: 6px 16px; border-radius: 7px; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* ---------- learn ---------- */
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.card > summary { list-style: none; cursor: pointer; padding: 14px 20px; display: flex; gap: 12px; align-items: baseline; font: 600 16px var(--font-head); }
.card > summary::-webkit-details-marker { display: none; }
.card > summary .n { color: var(--faint); font-variant-numeric: tabular-nums; min-width: 1.5em; }
.card > summary .seen { margin-left: auto; font: 500 12px var(--font-ui); color: var(--pass); }
.card[open] > summary { border-bottom: 1px solid var(--line); }
.cardBody { padding: 16px 20px 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; }
.md { max-width: 68ch; }
.md p { margin: 0 0 10px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 20px; }
.md li { margin: 2px 0; }
.md pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0 0 10px; }
.md h3 { font: 600 15px var(--font-head); margin: 12px 0 6px; }

/* ---------- practice ---------- */
.practice { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
.itemList { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 68px); max-height: calc(100vh - 100px); overflow: auto; }
.itemBtn { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; text-align: left; padding: 7px 8px; border-radius: 7px; border: 0; background: none; font-size: 13px; line-height: 1.3; }
.itemBtn:hover { background: var(--surface-2); }
.itemBtn[aria-current="true"] { background: var(--accent-soft); }
.itemBtn .kind { font-size: 11px; color: var(--faint); white-space: nowrap; }
.mark { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 9px; line-height: 1; }
.mark.tried { border-color: var(--warn); }
.mark.solved { border-color: var(--pass); background: var(--pass); color: var(--surface); }
.mark.review { border-color: var(--warn); background: var(--warn); color: var(--surface); }
.mark.solved::after { content: "✓"; } .mark.review::after { content: "↺"; }

.work { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.workHead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.workHead h2 { font: 700 21px/1.25 var(--font-head); margin: 0; flex-basis: 100%; text-wrap: balance; }
.kindTag { font: 600 11px var(--font-head); letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.kindTag.exam { background: var(--fail-soft); color: var(--fail); }
.level { font-size: 12px; color: var(--muted); }
.status { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.status.solved { background: var(--pass-soft); color: var(--pass); }
.status.review { background: var(--warn-soft); color: var(--warn); }
.status.tried { background: var(--surface-2); color: var(--muted); }

.codeBlock { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0; white-space: pre; line-height: 1.55; }
.editorWrap { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
.editorWrap.exam { border-color: var(--fail); }
.editorWrap textarea.fallback { width: 100%; min-height: 240px; border: 0; padding: 12px; background: var(--code-bg); font: 13px/1.55 var(--font-code); resize: vertical; tab-size: 4; }
.CodeMirror { height: auto; min-height: 180px; font-family: var(--font-code); font-size: 13.5px; line-height: 1.55; background: var(--code-bg); color: var(--ink); }
.CodeMirror-scroll { min-height: 180px; max-height: 560px; }
.CodeMirror-gutters { background: var(--code-bg); border-right: 1px solid var(--line); }
.CodeMirror-linenumber { color: var(--faint); }
.CodeMirror-cursor { border-left: 2px solid var(--accent); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: var(--accent-soft); }
.CodeMirror-matchingbracket { color: var(--pass) !important; text-decoration: underline; }
.cm-keyword { color: var(--cm-keyword); } .cm-string, .cm-string-2 { color: var(--cm-string); } .cm-number, .cm-atom { color: var(--cm-number); }
.cm-comment { color: var(--cm-comment); font-style: italic; } .cm-def { color: var(--cm-def); } .cm-builtin, .cm-type { color: var(--cm-builtin); }
.cm-variable-2, .cm-property { color: var(--ink); } .cm-operator { color: var(--muted); }
.errLine { background: var(--fail-soft); }
.errGutter { color: var(--fail); font-weight: 700; padding-left: 4px; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn kbd { font: 11px var(--font-code); opacity: 0.75; }
.note { font-size: 12px; color: var(--muted); }

.options { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.opt:hover { border-color: var(--muted); }
.opt .box { width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 50%; margin-top: 2px; display: grid; place-items: center; font-size: 11px; }
.opt.multi .box { border-radius: 4px; }
.opt > span { min-width: 0; overflow-wrap: anywhere; }
.opt code { overflow-wrap: anywhere; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .box { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--pass); background: var(--pass-soft); }
.opt.wrong { border-color: var(--fail); background: var(--fail-soft); }

textarea.answer { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--code-bg); font: 13px/1.55 var(--font-code); resize: vertical; }
.fillCode { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; white-space: pre; font: 13.5px/2 var(--font-code); }
.fillCode input { font: inherit; line-height: 1.4; padding: 0 4px; border: 1px solid var(--accent); border-radius: 4px; background: var(--surface); min-width: 3ch; }

.parsons { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.parsons h5 { margin: 0 0 6px; font: 600 12px var(--font-head); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.lineBox { min-height: 120px; border: 1px dashed var(--line); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 4px; background: var(--code-bg); }
.pline { text-align: left; white-space: pre; font: 13px/1.5 var(--font-code); padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); overflow-x: auto; }
.pline:hover { border-color: var(--accent); }

.results { display: flex; flex-direction: column; gap: 10px; }
.verdict { display: flex; align-items: center; gap: 10px; font: 600 15px var(--font-head); padding: 10px 14px; border-radius: 8px; }
.verdict.pass { background: var(--pass-soft); color: var(--pass); }
.verdict.fail { background: var(--fail-soft); color: var(--fail); }
.verdict .next { margin-left: auto; }
.tests { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.tests li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 13.5px; padding: 6px 10px; border-radius: 6px; background: var(--surface-2); }
.tests li .m { font-weight: 700; }
.tests li.ok .m { color: var(--pass); } .tests li.no .m { color: var(--fail); }
.tests .detail { font: 12.5px/1.5 var(--font-code); color: var(--muted); white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
.tests .detail b { color: var(--ink); font-weight: 600; }
.outBox { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 12.5px/1.55 var(--font-code); white-space: pre-wrap; word-break: break-word; max-height: 280px; overflow: auto; margin: 0; }
.outBox.err { border-color: var(--fail); color: var(--fail); background: var(--fail-soft); }
.gloss { font-size: 13px; color: var(--ink); background: var(--warn-soft); border-radius: 6px; padding: 8px 12px; }
.panelLabel { font: 600 12px var(--font-head); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.hintBox { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 14px; }
.solution { border: 1px solid var(--warn); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.explain { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 6px 6px 0; }
.context { border-left: 3px solid var(--line); background: var(--surface-2); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 14px; }
.context p:last-child { margin-bottom: 0; }
.context .panelLabel { margin-bottom: 4px; }
.cardLinks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.cardLinks button { font: 500 13px var(--font-ui); color: var(--accent); background: var(--accent-soft); border: 1px solid transparent; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.cardLinks button[aria-expanded="true"] { border-color: var(--accent); }
.cardPeek { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.cardPeek h4 { margin: 0; font: 600 14px var(--font-head); }
.checks ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
.checks li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.checks li > span, .checks code { min-width: 0; overflow-wrap: anywhere; }
.checks li::before { content: "·"; color: var(--faint); }
.checks code { font: 12.5px var(--font-code); color: var(--ink); background: var(--code-bg); border-radius: 4px; padding: 1px 6px; word-break: break-word; white-space: break-spaces; }
.cardBody.textOnly { grid-template-columns: minmax(0, 1fr); }

.examBar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--fail-soft); border: 1px solid var(--fail); color: var(--ink); border-radius: 10px; padding: 12px 16px; }
.examBar .clock { font: 700 22px var(--font-code); color: var(--fail); font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font: 700 21px var(--font-head); margin: 0; }
.statGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font: 700 26px var(--font-head); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
table.dayTable { width: 100%; border-collapse: collapse; font-size: 14px; }

<script>
"use strict";
const COURSE = window.CC_COURSE || { days: [] };
const H = window.CC_HARNESS || {};
const BASE = new URL(".", document.baseURI).href;
const HAS_CM = typeof window.CodeMirror === "function";
const KIND = { choice: "选择", predict: "预测输出", code: "写函数", fix: "修 bug", fill: "填空", order: "排代码", scratch: "从零手写", translate: "翻译", local: "本机任务", testwrite: "写测试", sql: "写 SQL" };
const WEEK_TITLE = { 1: "第 1 周 · 入门", 2: "第 2 周 · 写成小程序", 3: "第 3 周 · 工程与 Agent", 4: "第 4 周 · 云与数据", 5: "第 5 周 · LangChain 与 LangGraph" };

const LANG = { py: "Python", ts: "TypeScript", sql: "SQL", docker: "Dockerfile" };
const RUNNABLE = new Set(["code", "fix", "scratch", "translate", "fill", "order"]);
const SOLUTION_AFTER_TRIES = 2;
const SOLUTION_AFTER_MS = 10 * 60 * 1000;
const EXAM_MS_PER_ITEM = 12 * 60 * 1000;

const ALL_ITEMS = [];
const ITEM = {};
for (const d of COURSE.days) for (const it of d.items) { it.day = Number(d.id); ALL_ITEMS.push(it); ITEM[it.id] = it; }
const $ = (sel, root = document) => root.querySelector(sel);

    if (k === "class") el.className = v;

// ---------------------------------------------------------------- markdown (small subset)
function inline(s) {

  return esc(s).replace(/``\s?(.+?)\s?``|`([^`]+)`/g, (m, dbl, one) => `<code>${dbl !== undefined ? dbl : one}</code>`)

function md(text) {

  const flushPara = () => { if (para.length) { html += `<p>${inline(para.join(" "))}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `<${list.tag}${list.start > 1 ? ` start="${list.start}"` : ""}>${list.items.map((x) => `<li>${inline(x)}</li>`).join("")}</${list.tag}>`; list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const fence = /^```(\w*)/.exec(line);
    if (fence) {
      flushPara(); flushList();
      const buf = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) buf.push(lines[i]);
      html += `<pre class="codeBlock" data-lang="${fence[1] || ""}">${esc(buf.join("\n"))}</pre>`;
      continue;
    }
    const ul = /^\s*[-*] (.*)$/.exec(line), ol = /^\s*(\d+)\. (.*)$/.exec(line), hd = /^###\s+(.*)$/.exec(line);
    if (hd) { flushPara(); flushList(); html += `<h3>${inline(hd[1])}</h3>`; }
    else if (ul || ol) {
      flushPara();
      const tag = ul ? "ul" : "ol";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [], start: ol ? Number(ol[1]) : 1 }; }
      list.items.push(ul ? ul[1] : ol[2]);
    }
    else if (!line.trim()) { flushPara(); flushList(); }
    else if (list && /^\s{2,}/.test(line)) list.items[list.items.length - 1] += " " + line.trim();
    else { flushList(); para.push(line.trim()); }
  }

  return html;
}
function highlightIn(root, fallbackLang) {
  if (!HAS_CM || !CodeMirror.runMode) return;
  root.querySelectorAll("pre.codeBlock").forEach((pre) => {
    const lang = pre.dataset.lang || fallbackLang;
    const mode = lang === "ts" || lang === "typescript" ? "text/typescript" : lang === "py" || lang === "python" ? "python" : lang === "sql" ? "text/x-sqlite" : null;
    if (!mode) return;
    const text = pre.textContent;
    pre.textContent = "";
    CodeMirror.runMode(text, mode, pre);

}
function codeBlock(text, lang) {
  const pre = h("pre", { class: "codeBlock", "data-lang": lang }, text);
  highlightIn(h("div", {}, pre), lang);
  return pre;
}

// ---------------------------------------------------------------- state
const STORE_KEY = "cc7-progress-v1";
const STATE = { v: 1, items: {}, exams: {}, checks: {}, seen: {}, settings: { allowPaste: false }, current: { day: 1, tab: "learn", item: {}, view: "day" }, exam: null, startedAt: Date.now() };
function rec(id) { return (STATE.items[id] ||= { s: "new", a: 0, h: 0, sol: false, review: false, u: 0 }); }
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) merge(JSON.parse(raw)); } catch (e) { /* storage unavailable: start fresh */ }
}
const RANK = { new: 0, tried: 1, solved: 2 };
function merge(other) {
  if (!other || typeof other !== "object") return;
  for (const [id, r] of Object.entries(other.items || {})) {
    const mine = rec(id);
    const newer = (r.u || 0) > (mine.u || 0);
    if (RANK[r.s] > RANK[mine.s]) mine.s = r.s;
    mine.a = Math.max(mine.a || 0, r.a || 0);
    mine.h = Math.max(mine.h || 0, r.h || 0);
    mine.sol = mine.sol || !!r.sol;
    if (newer) { mine.review = !!r.review; if (r.code !== undefined) mine.code = r.code; if (r.fills) mine.fills = r.fills; if (r.order) mine.order = r.order; mine.u = r.u; }
    if (r.t && (!mine.t || r.t < mine.t)) mine.t = r.t;
    mine.sec = Math.max(mine.sec || 0, r.sec || 0);
  }
  for (const [d, e] of Object.entries(other.exams || {})) {
    const mine = STATE.exams[d];
    if (!mine || (e.best || 0) > (mine.best || 0) || (e.at || 0) > (mine.at || 0)) STATE.exams[d] = { ...mine, ...e, best: Math.max(e.best || 0, mine?.best || 0) };
  }
  Object.assign(STATE.checks, other.checks || {});
  Object.assign(STATE.seen, other.seen || {});
  if (other.settings) STATE.settings = { ...STATE.settings, ...other.settings };
  if (other.current && !merge.done) { STATE.current = { ...STATE.current, ...other.current }; }
  if (other.exam && other.exam.active && (!STATE.exam || !STATE.exam.active)) STATE.exam = other.exam;
  if (other.startedAt) STATE.startedAt = Math.min(STATE.startedAt, other.startedAt);
  merge.done = true;
}
// Cloud layout: progress/<uid> holds status + a summary for Claude (no drafts);
// progress/<uid>/drafts/d<N> holds that day's code drafts, so no document nears the 256 KiB cap.
const DRAFT_KEYS = ["code", "fills", "order"];
function snapshot() {
  const solved = ALL_ITEMS.filter((it) => STATE.items[it.id]?.s === "solved");
  const items = {};
  for (const [id, r] of Object.entries(STATE.items)) {
    const rest = { ...r };
    for (const k of DRAFT_KEYS) delete rest[k];
    items[id] = rest;
  }
  const byDay = {};
  for (const d of COURSE.days) byDay[d.id] = `${dayProgress(d).done}/${d.items.length}`;
  return {
    ...STATE,
    v: 2,
    items,
    summary: {
      solved: solved.length,
      mastered: solved.filter((it) => !STATE.items[it.id].review).length,
      total: ALL_ITEMS.length,
      byDay,
      review: ALL_ITEMS.filter((it) => STATE.items[it.id]?.review).map((it) => it.id),
      stuck: ALL_ITEMS.filter((it) => { const r = STATE.items[it.id]; return r && r.s !== "solved" && r.a >= 3; }).map((it) => it.id),
      exams: STATE.exams,
      updatedAt: new Date().toISOString(),
    },
  };
}
function draftDocs() {
  const out = {};
  for (const [id, r] of Object.entries(STATE.items)) {
    const it = ITEM[id];
    if (!it) continue;
    const d = {};
    for (const k of DRAFT_KEYS) if (r[k] !== undefined) d[k] = r[k];
    if (!Object.keys(d).length) continue;
    d.u = r.u || 0;
    (out["d" + it.day] ||= { items: {} }).items[id] = d;
  }
  return out;
}
function mergeDrafts(items) {
  for (const [id, d] of Object.entries(items || {})) {
    const mine = rec(id);
    if ((d.u || 0) < (mine.u || 0)) continue;   // this browser has newer work
    for (const k of DRAFT_KEYS) if (d[k] !== undefined) mine[k] = d[k];
  }
}
let saveTimer = null;
function writeLocal() { try { localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); } catch (e) { /* ignore */ } }
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeLocal, 300);
  scheduleCloud();
}
// an editor's draft that is still waiting for its debounce; flushed when the tab is hidden or closed
let PENDING_DRAFT = null;
function pendingDraft(fn) {
  const run = () => { if (PENDING_DRAFT === run) PENDING_DRAFT = null; fn(); };
  PENDING_DRAFT = run;
  return run;
}
function saveNow() {
  if (PENDING_DRAFT) PENDING_DRAFT();
  clearTimeout(saveTimer);
  writeLocal();
}

// ---- cloud progress (db capability): readable by Claude, survives devices
const CLOUD = { ref: null, drafts: null, sent: {}, ready: false, busy: false, dirty: false, timer: null };
function setChip(id, cls, text) { const c = $("#" + id); c.className = "chip " + (cls || ""); c.lastElementChild.textContent = text; }
function scheduleCloud() { if (!CLOUD.ready) return; CLOUD.dirty = true; clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(flushCloud, 2500); }
async function flushCloud() {
  if (!CLOUD.ready || CLOUD.busy || !CLOUD.dirty) return;
  CLOUD.busy = true; CLOUD.dirty = false;
  try {
    await CLOUD.ref.set(JSON.parse(JSON.stringify(snapshot())));
    // drafts: only the days whose drafts changed since the last write
    const docs = draftDocs();
    for (const key of new Set([...Object.keys(docs), ...Object.keys(CLOUD.sent)])) {
      const text = JSON.stringify(docs[key] || { items: {} });
      if (CLOUD.sent[key] === text) continue;
      try { await CLOUD.drafts.doc(key).set(JSON.parse(text)); }
      catch (e) { if (!(e && e.code === "invalid_argument")) throw e; }   // an oversized day stays local only

    }

  }
  catch (e) {
    if (e && e.code === "invalid_argument") { CLOUD.ready = false; setChip("syncChip", "bad", "进度：只能存本机"); }
    else { CLOUD.dirty = true; setChip("syncChip", "busy", "进度：同步重试中"); }

async function initCloud() {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db) return;
    const uid = user ? await user.id() : null;
    CLOUD.ref = db.doc("progress/" + (uid || "me"));
    CLOUD.drafts = CLOUD.ref.collection("drafts");
    setChip("syncChip", "busy", "进度：读取中");
    const [snap, drafts] = await Promise.all([CLOUD.ref.get(), CLOUD.drafts.get().catch(() => null)]);
    if (snap.exists) { merge.done = true; merge(snap.data()); }   // older (v1) docs still carry drafts inline
    if (drafts) for (const d of drafts.docs) { const body = d.data() || {}; mergeDrafts(body.items); CLOUD.sent[d.id] = JSON.stringify(body); }
    if (snap.exists || (drafts && !drafts.empty)) render();
    CLOUD.ready = true;
    setChip("syncChip", "ok", "进度：已同步");
    // push what only this browser has (e.g. work done offline, or a v1 doc to move to the new layout)
    const stable = (o) => JSON.stringify(o, (k, v) => (v && typeof v === "object" && !Array.isArray(v) ? Object.fromEntries(Object.entries(v).sort()) : v));
    const cloudDoc = snap.exists ? snap.data() || {} : {};

    const draftsDiffer = Object.entries(draftDocs()).some(([key, body]) => CLOUD.sent[key] === undefined || stable(JSON.parse(CLOUD.sent[key])) !== stable(body));

}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { saveNow(); clearTimeout(CLOUD.timer); flushCloud(); } });
window.addEventListener("pagehide", saveNow);

// ---------------------------------------------------------------- Python runtime (Pyodide in a module worker)
const PY = { state: "idle", worker: null, ready: null, main: null, seq: 0, waiters: new Map() };
function pySetChip() {
  const map = { idle: ["", "Python：点运行时启动"], loading: ["busy", "Python：首次下载约 14 MB…"], ready: ["ok", "Python 3.14：就绪"], failed: ["bad", "Python：无法启动"] };
  setChip("pyChip", ...map[PY.state]);
}
// Shared by the worker and the on-page fallback: install Pydantic on first use.
// The wheels ship as .wasm-named files (the host serves no .whl); unpack them into site-packages.
async function ccEnsurePydantic(py, idx, wheels, code) {
  if (!/\bpydantic\b/.test(code) || py.__ccPydantic) return;
  const site = py.runPython("import site; site.getsitepackages()[0]");
  for (const f of wheels) {
    const res = await fetch(idx + "pkg/" + f);
    if (!res.ok) throw new Error("下载 " + f + " 失败：" + res.status);
    py.unpackArchive(new Uint8Array(await res.arrayBuffer()), "wheel", { extractDir: site });
  }
  py.runPython("import importlib; importlib.invalidate_caches()");
  py.__ccPydantic = true;
}
// The LangChain week: the real libraries (+ everything they import) and tiktoken's encoding file,
// then one import of the whole stack (a few seconds), before any timed run.
async function ccEnsureLangchain(py, idx, wheels, lcWheels, tiktoken) {
  if (py.__ccLangchain) return;
  await ccEnsurePydantic(py, idx, wheels, "pydantic");
  const get = async (f) => {
    const res = await fetch(idx + "pkg/" + f);
    if (!res.ok) throw new Error("下载 " + f + " 失败：" + res.status);
    return new Uint8Array(await res.arrayBuffer());
  };
  const [files, enc] = await Promise.all([Promise.all(lcWheels.map(get)), get(tiktoken.file)]);
  const site = py.runPython("import site; site.getsitepackages()[0]");
  for (const bytes of files) py.unpackArchive(bytes, "wheel", { extractDir: site });
  py.FS.mkdirTree(tiktoken.cache.slice(0, tiktoken.cache.lastIndexOf("/")));
  py.FS.writeFile(tiktoken.cache, enc);
  py.runPython("import importlib; importlib.invalidate_caches(); import _cclc; _cclc.prepare()");
  py.__ccLangchain = true;
}
function pyWorkerSource() {
  const idx = BASE + "pyodide/";
  return `import { loadPyodide } from ${JSON.stringify(idx + "pyodide.mjs")};
${ccEnsurePydantic.toString()}
${ccEnsureLangchain.toString()}
let py = null, run = null, runSql = null, wheels = [];
self.onmessage = async (e) => {
  const m = e.data;
  try {
    if (m.type === "init") {
      wheels = m.wheels;
      py = await loadPyodide({ indexURL: ${JSON.stringify(idx)}, stdLibURL: ${JSON.stringify(idx + "python_stdlib.wasm")} });
      py.runPython(m.runner);
      for (const [name, src] of m.modules) py.globals.get("_cc_load_module")(name, src);
      run = py.globals.get("run");
      runSql = py.globals.get("_cc_run_sql");
      postMessage({ type: "ready" });
    } else if (m.type === "prep") {
      await ccEnsureLangchain(py, ${JSON.stringify(idx)}, wheels, m.lcWheels, m.tiktoken);
      postMessage({ type: "prepped", id: m.id });
    } else if (m.type === "run") {
      if (m.kind !== "sql") await ccEnsurePydantic(py, ${JSON.stringify(idx)}, wheels, m.code + "\\n" + (m.tests || "") + "\\n" + (m.setup || ""));
      const fn = m.kind === "sql" ? runSql : run;
      postMessage({ type: "result", id: m.id, result: JSON.parse(fn(m.code, m.tests || "", m.setup || "")) });
    }
  } catch (err) {
    postMessage({ type: m.type === "init" ? "init-error" : "run-error", id: m.id, error: String((err && err.message) || err).slice(-2000) });
  }

}
function wasmAllowed() {

}
function pyStart() {
  if (PY.ready) return PY.ready;
  PY.lc = null;   // a new runtime has not loaded LangChain yet

    return Promise.reject(new Error("这个浏览器环境不允许运行 WebAssembly，所以没法在页面里跑 Python"));

    setTimeout(() => reject(new Error("启动超过 3 分钟：网络太慢或运行环境加载失败，刷新页面再试")), 180000);
    let w;
    try { w = new Worker(URL.createObjectURL(new Blob([pyWorkerSource()], { type: "text/javascript" })), { type: "module" }); }

      else { const done = PY.waiters.get(m.id); if (done) { PY.waiters.delete(m.id); done(m); } }
    };
    w.onerror = (e) => { if (PY.state === "loading") { e.preventDefault(); w.terminate(); PY.worker = null; pyStartMain().then(resolve, reject); } };
    w.postMessage({ type: "init", runner: H.PY_RUNNER, modules: PY_MODULES(), wheels: H.WHEELS || [] });
  });

async function runPython(code, tests, setup, kind) {
  try { await pyStart(); }

  setup = setup || "";
  if (setup.includes(LC_PREP)) {
    try { await pyPrepLangchain(); }
    catch (e) { return { runtimeError: "浏览器里的 LangChain 加载失败：" + (e && e.message || e) + "。刷新页面再试；也可以用「复制为本机文件」在本机运行。" }; }
  }

    if (kind === "sql") return JSON.parse(PY.main.runSql(code, tests || "", setup));

    return JSON.parse(PY.main.run(code, tests || "", setup));

  return new Promise((resolve) => {
    const timer = setTimeout(() => {
      PY.waiters.delete(id);
      PY.worker.terminate(); PY.worker = null; PY.ready = null; PY.state = "idle"; pySetChip();
      resolve({ runtimeError: "运行超过 10 秒被强制停止。最常见的原因是死循环：while 的条件永远成立，或者循环里忘了更新变量。" });
    }, 10000);
    PY.waiters.set(id, (m) => { clearTimeout(timer); resolve(m.type === "result" ? m.result : { runtimeError: m.error }); });

// Load LangChain once per runtime, outside the 10-second limit of a run (~11 MB the first time, then cached).

// ---------------------------------------------------------------- TypeScript runtime (compiler in page, code in a worker)
const TSR = { state: "idle", ready: null, libs: null };
function tsSetChip() {
  const map = { idle: ["", "TypeScript：点运行时启动"], loading: ["busy", "TypeScript：加载编译器…"], ready: ["ok", "TypeScript 5.6：就绪"], failed: ["bad", "TypeScript：无法启动"] };
  setChip("tsChip", ...map[TSR.state]);
}
function loadScript(src) {
  return new Promise((resolve, reject) => { const s = document.createElement("script"); s.src = src; s.onload = resolve; s.onerror = () => reject(new Error("加载失败 " + src)); document.head.append(s); });
}
function tsStart() {
  if (TSR.ready) return TSR.ready;
  TSR.state = "loading"; tsSetChip();
  TSR.ready = (async () => {
    const [libs] = await Promise.all([
      fetch(BASE + "ts-libs.json").then((r) => { if (!r.ok) throw new Error("ts-libs.json " + r.status); return r.json(); }),
      window.ts ? null : loadScript("https://cdnjs.cloudflare.com/ajax/libs/typescript/5.6.3/typescript.min.js"),
    ]);
    TSR.libs = libs;
    CCTS.compile(window.ts, libs, "const warm: number = 1;", "");
    TSR.state = "ready"; tsSetChip();
  })();
  TSR.ready.catch(() => { TSR.state = "failed"; tsSetChip(); TSR.ready = null; });
  return TSR.ready;
}
async function runTypeScript(code, tests) {
  try { await tsStart(); }
  catch (e) { return { runtimeError: "TypeScript 编译器加载失败：" + (e && e.message || e) }; }
  let compiled;
  try { compiled = CCTS.compile(window.ts, TSR.libs, code, tests || ""); }
  catch (e) { return { runtimeError: "编译器内部错误：" + (e && e.message || e) }; }
  const job = CCTS.buildJob(H.TS_RUNTIME, compiled.js);
  const needsZod = /from\s+["']zod["']|require\(["']zod["']\)/.test(code + tests);
  const src = (needsZod ? `importScripts(${JSON.stringify(BASE + "zod.iife.js")});\n` : "") + job;
  const result = await new Promise((resolve) => {
    let w;
    try { w = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" }))); }
    catch (e) { resolve({ runtimeError: "无法创建运行环境：" + e.message }); return; }
    const timer = setTimeout(() => { w.terminate(); resolve({ runtimeError: "运行超过 6 秒被强制停止。检查是否有死循环，或 await 了一个永远不会完成的 Promise。" }); }, 6000);
    w.onmessage = (e) => { clearTimeout(timer); w.terminate(); resolve(e.data); };
    w.onerror = (e) => { e.preventDefault(); clearTimeout(timer); w.terminate(); resolve({ error: "SyntaxError / 运行错误：" + (e.message || "脚本无法执行"), tests: [] }); };
  });
  return { ...result, diagnostics: compiled.diagnostics };
}
function runCode(item, code) {
  if (item.lang === "sql") return runSql(item, code, true);

}

let CM = null;
const DOCS = {};
function makeEditor(host, { value, lang, exam, onRun, onChange, minHeight }) {
  const blockPaste = () => exam || !STATE.settings.allowPaste;
  if (HAS_CM) {
    const cm = CodeMirror(host, {
      value, mode: lang === "ts" ? "text/typescript" : lang === "sql" ? "text/x-sqlite" : "python", lineNumbers: true, indentUnit: lang === "py" ? 4 : 2, tabSize: 4,
      indentWithTabs: false, matchBrackets: true, viewportMargin: Infinity, lineWrapping: false,
      extraKeys: {
        Tab: (c) => (c.somethingSelected() ? c.indentSelection("add") : c.replaceSelection(" ".repeat(c.getOption("indentUnit")), "end")),
        "Shift-Tab": (c) => c.indentSelection("subtract"),
        "Ctrl-Enter": () => onRun && onRun(), "Cmd-Enter": () => onRun && onRun(),
      },
    });
    cm.on("beforeChange", (c, ch) => {
      if ((ch.origin === "paste" || ch.origin === "drop") && blockPaste()) { ch.cancel(); toast(exam ? "闭卷模式不能粘贴，请手写" : "粘贴已关闭：手敲一遍记得更牢（右上角可以打开）"); }
    });
    if (onChange) cm.on("changes", () => onChange(cm.getValue()));
    if (minHeight) cm.getWrapperElement().style.minHeight = minHeight;
    return {
      get: () => cm.getValue(), set: (v) => cm.setValue(v), focus: () => cm.focus(), refresh: () => cm.refresh(),
      markLines(lines) {
        cm.eachLine((l) => cm.removeLineClass(l, "background", "errLine"));
        for (const n of lines) if (n >= 1 && n <= cm.lineCount()) cm.addLineClass(n - 1, "background", "errLine");
      },
    };
  }
  const ta = h("textarea", { class: "fallback", spellcheck: "false" });
  ta.value = value;
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Tab") { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText(" ".repeat(lang === "ts" ? 2 : 4), s, ta.selectionEnd, "end"); }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); onRun && onRun(); }
  });
  ta.addEventListener("paste", (e) => { if (blockPaste()) { e.preventDefault(); toast("粘贴已关闭：请手写"); } });
  if (onChange) ta.addEventListener("input", () => onChange(ta.value));
  host.append(ta);
  return { get: () => ta.value, set: (v) => (ta.value = v), focus: () => ta.focus(), refresh() {}, markLines() {} };
}

function expectTrue(label: string, fn: () => unknown) { try { _show(Boolean(fn()), label); } catch (e) { _show(false, label, "报错 " + e); } }
function expectThrows(label: string, fn: () => unknown) { try { fn(); _show(false, label, "没有报错"); } catch { _show(true, label); } }
function expectOutput(label: string, fn: () => void, expected: string) { const lines: string[] = []; const old = console.log; console.log = (...a: unknown[]) => { lines.push(a.join(" ")); }; try { fn(); } finally { console.log = old; } _show(lines.join("\\n") === expected, label, "输出 " + JSON.stringify(lines.join("\\n"))); }
function expectAsync(label: string, fn: () => Promise<unknown>, expected: unknown) { _pending.push(fn().then((got) => _show(_eq(got, expected), label, \`得到 \${JSON.stringify(got)}，期望 \${JSON.stringify(expected)}\`), (e) => _show(false, label, "报错 " + e))); }
function expectTrueAsync(label: string, fn: () => Promise<unknown>) { _pending.push(fn().then((got) => _show(Boolean(got), label), (e) => _show(false, label, "报错 " + e))); }
function expectRejects(label: string, fn: () => Promise<unknown>) { _pending.push(fn().then(() => _show(false, label, "没有报错"), () => _show(true, label))); }

`;
}
function testwriteFile(item, code) {

${item.langchain ? "#   先安装真正的 LangChain：" + LC_INSTALL + "\n" : ""}#   或：python ${item.id}.py                （不用 pytest 也能跑，但不能 import pytest）

# ---- 被测函数（正确版本）----

if __name__ == "__main__":

// ---------------------------------------------------------------- progress helpers
function dayOf(n) { return COURSE.days.find((d) => Number(d.id) === Number(n)); }
function practiceItems(day) { return day.items.filter((it) => !it.exam); }
function examItems(day) { return day.items.filter((it) => it.exam); }
function status(id) {
  const r = STATE.items[id];
  if (!r) return "new";
  if (r.review) return "review";
  return r.s;
}
function dayProgress(day) {
  const done = day.items.filter((it) => STATE.items[it.id]?.s === "solved").length;
  return { done, total: day.items.length };
}
function canSeeSolution(item, r) {
  if (isExamLive(item)) return { ok: false, why: "闭卷进行中" };
  if (r.s === "solved") return { ok: true };
  if (r.a >= SOLUTION_AFTER_TRIES) return { ok: true };
  const opened = SESSION.opened[item.id];
  if (opened && Date.now() - opened >= SOLUTION_AFTER_MS) return { ok: true };
  return { ok: false, why: `再认真试 ${SOLUTION_AFTER_TRIES - r.a} 次（或独立思考 10 分钟）后可以看答案` };
}
function isExamLive(item) { return !!(STATE.exam && STATE.exam.active && item.exam && Number(STATE.exam.day) === item.day); }
const SESSION = { opened: {}, results: {}, hintsShown: {}, solShown: {}, choice: {}, redo: {} };

function markAttempt(item, passed, meta = {}) {
  const r = rec(item.id);
  r.a = (r.a || 0) + 1;
  r.u = Date.now();
  if (passed) {
    const firstTime = r.s !== "solved";
    if (r.s !== "solved") r.t = Date.now();
    r.s = "solved";
    // review rules: a solve that needed the answer, many hints or many tries goes to review;
    // a clean re-solve from review clears it.
    const sawNow = SESSION.solShown[item.id];
    if (r.review && !sawNow && SESSION.redo[item.id]) r.review = false;
    else if (firstTime && (r.sol || r.h >= 2 || r.a >= 5 || meta.wrongChoices >= 2)) r.review = true;
  } else if (r.s === "new") r.s = "tried";
  save();
  renderRail(); renderMeter();
}

// ---------------------------------------------------------------- render: shell
function renderMeter() {
  const solved = ALL_ITEMS.filter((it) => STATE.items[it.id]?.s === "solved");
  const mastered = solved.filter((it) => !STATE.items[it.id].review).length;
  $("#meterFill").style.width = (ALL_ITEMS.length ? (100 * mastered) / ALL_ITEMS.length : 0) + "%";
  $("#meterText").textContent = `${mastered} / ${ALL_ITEMS.length}`;
}
function renderRail() {
  const rail = $("#rail");
  rail.replaceChildren();
  // one week open at a time (the current day's week unless the learner opened another)
  const openWeek = SESSION.railWeek !== undefined ? SESSION.railWeek : weekOf(STATE.current.day);
  const weeks = [...new Set(COURSE.days.map((d) => weekOf(d.id)))];
  for (const w of weeks) {
    const days = COURSE.days.filter((d) => weekOf(d.id) === w);
    const done = days.reduce((n, d) => n + dayProgress(d).done, 0);
    const total = days.reduce((n, d) => n + d.items.length, 0);
    const open = w === openWeek;
    rail.append(h("button", { class: "weekBtn", "aria-expanded": open ? "true" : "false", onclick: () => { SESSION.railWeek = open ? null : w; renderRail(); } },
      h("span", { class: "wt" }, WEEK_TITLE[w] || `第 ${w} 周`),
      h("span", { class: "wp" }, `${done}/${total}`),
      h("span", { class: "bar" }, h("i", { style: `width:${total ? (100 * done) / total : 0}%` }))));
    if (!open) continue;
    for (const d of days) {
      const p = dayProgress(d);
      const cur = STATE.current.view === "day" && Number(STATE.current.day) === Number(d.id);
      rail.append(h("button", { class: "dayBtn", "aria-current": cur ? "true" : "false", onclick: () => go({ view: "day", day: Number(d.id) }) },
        h("span", { class: "num" }, d.id),
        h("span", { class: "t" }, d.title.split("：")[0]),
        h("span", { class: "p" }, h("span", { class: "bar" }, h("i", { style: `width:${p.total ? (100 * p.done) / p.total : 0}%` })), `${p.done}/${p.total}`)));
    }
  }
  const reviewCount = ALL_ITEMS.filter((it) => STATE.items[it.id]?.review).length;
  rail.append(h("h4", {}, "巩固"));
  rail.append(h("button", { class: "navBtn", "aria-current": STATE.current.view === "review" ? "true" : "false", onclick: () => go({ view: "review" }) }, "复习区", reviewCount ? h("span", { class: "badge" }, reviewCount) : ""));
  rail.append(h("button", { class: "navBtn", "aria-current": STATE.current.view === "stats" ? "true" : "false", onclick: () => go({ view: "stats" }) }, "我的进度", ""));
}
function go(patch) {
  if (patch.day !== undefined) SESSION.railWeek = undefined;   // follow the chosen day's week
  Object.assign(STATE.current, patch);
  save();
  render();
  window.scrollTo({ top: 0 });
}
function render() {

// ---------------------------------------------------------------- render: day

  const head = h("section", { class: "dayHead" },

    h("div", {},
      h("p", { class: "panelLabel", style: "margin-bottom:8px" }, "今天完成标准"),

function resultView(res, { item, editor, onPassNext, noTests }) {
  const els = [];
  if (res.runtimeError) { els.push(h("pre", { class: "outBox err" }, res.runtimeError)); return els; }
  const diags = res.diagnostics || [];
  const userDiags = diags.filter((d) => !d.inTests);
  const testDiags = diags.filter((d) => d.inTests);
  const tests = res.tests || [];
  const passed = tests.filter((t) => t.passed).length;
  const ok = !noTests && !res.error && !diags.length && tests.length > 0 && passed === tests.length;
  if (!noTests) {
    const v = h("div", { class: "verdict " + (ok ? "pass" : "fail") },
      ok ? `全部通过 ${passed}/${tests.length}` : res.error ? "代码没能运行完" : diags.length && !tests.length ? "类型检查没通过" : `通过 ${passed}/${tests.length}` + (diags.length ? " · 类型检查有错误" : ""));
    if (ok && onPassNext) v.append(h("button", { class: "btn next", onclick: onPassNext }, "下一题 →"));
    els.push(v);
  }
  if (userDiags.length || testDiags.length) {
    els.push(h("p", { class: "panelLabel" }, "类型检查（tsc）"));
    const ul = h("ul", { class: "tests" });
    for (const d of [...userDiags, ...testDiags]) {
      ul.append(h("li", { class: "no" }, h("span", { class: "m" }, "✗"), h("div", {},
        h("div", {}, d.inTests ? `测试代码第 ${d.line} 行（多半是你的函数名、参数或返回类型和题目要求不一致）` : `第 ${d.line} 行，第 ${d.col} 列`),
        h("div", { class: "detail" }, `TS${d.code}: ${d.message}`),
        TS_GLOSS[d.code] ? h("div", { class: "detail" }, TS_GLOSS[d.code]) : "")));
    }
    els.push(ul);
    if (editor) editor.markLines(userDiags.map((d) => d.line));
  } else if (editor) editor.markLines(res.error_line ? [res.error_line] : []);
  if (res.error) {
    els.push(h("p", { class: "panelLabel" }, "报错"), h("pre", { class: "outBox err" }, res.error));
    const g = item.lang === "py" ? pyGloss(res.error) : item.lang === "sql" ? sqlGloss(res.error) : null;
    if (g) els.push(h("div", { class: "gloss" }, g));
  }
  if (tests.length) {
    els.push(h("p", { class: "panelLabel" }, "测试"));
    const ul = h("ul", { class: "tests" });
    for (const t of tests) {

    h("button", { class: "btn ghost", onclick: () => { ed.set(blank); out.replaceChildren(); } }, item.exam ? "清空" : "还原起始代码"),
    !exam ? h("button", { class: "btn ghost", onclick: () => exportLocal(item, ed.get(), out) }, "复制为本机文件") : ""));
  helpers(work, item, { exam, solution: item.solution, onRedo: () => { SESSION.redo[item.id] = true; r.code = blank; r.u = Date.now(); save(); ed.set(blank); out.replaceChildren(); ed.focus(); } });
  work.append(out);
  if (SESSION.results[item.id]) out.append(...resultView(SESSION.results[item.id], { item, onPassNext: ctx.next }));
  async function run(judge) {
    runBtn.disabled = true;
    out.replaceChildren(h("p", { class: "note" }, PY.state !== "ready" ? "正在启动 SQL 运行环境（第一次需要下载约 14 MB）…" : "运行中…"));
    const code = ed.get();
    r.code = code.slice(0, 8000);
    const res = await runSql(item, code, judge);
    runBtn.disabled = false;
    if (judge) {
      SESSION.results[item.id] = res;
      if (!res.runtimeError) markAttempt(item, isPass(res));
      if (exam) examCheck();
    }
    out.replaceChildren(...resultView(res, { item, onPassNext: ctx.next, noTests: !judge }));
    refreshHead(work, item);
  }
}

// ---- write the tests: must pass on the correct function and catch every hidden buggy version
async function runTestwrite(item, tests) {
  const onImpl = await runPython(tests, H.PY_DISCOVER, pySetup(item) + "\n" + item.impl);
  if (onImpl.runtimeError || !isPass(onImpl)) return { onImpl, mutants: [], pass: false };
  const mutants = [];
  for (const m of item.mutants) {
    const r = await runPython(tests, H.PY_DISCOVER, pySetup(item) + "\n" + m.code);
    if (r.runtimeError) return { onImpl: r, mutants: [], pass: false };
    const failed = (r.tests || []).filter((t) => !t.passed).map((t) => t.label);
    mutants.push({ note: m.note, caught: !!r.error || failed.length > 0, by: failed });
  }
  return { onImpl, mutants, pass: mutants.every((m) => m.caught) };
}
function testwriteView(res, item, next) {
  const els = [];
  const { onImpl, mutants } = res;
  if (onImpl.runtimeError) { els.push(h("pre", { class: "outBox err" }, onImpl.runtimeError)); return els; }
  const implOk = isPass(onImpl);
  const caught = mutants.filter((m) => m.caught).length;
  const v = h("div", { class: "verdict " + (res.pass ? "pass" : "fail") },
    res.pass ? `全部抓住：${caught}/${mutants.length} 个坏版本` : !implOk ? "你的测试在正确版本上没通过" : `抓住了 ${caught}/${mutants.length} 个坏版本`);
  if (res.pass && next) v.append(h("button", { class: "btn next", onclick: next }, "下一题 →"));
  els.push(v);
  if (!implOk) els.push(h("p", { class: "note" }, "正确的函数必须让你的每个测试都通过。先看下面哪个测试失败了：是期望值写错了，还是函数名 / 参数不对？"));
  els.push(h("p", { class: "panelLabel" }, "在正确版本上"));
  els.push(...resultView(onImpl, { item, noTests: false }).slice(1));
  if (implOk) {
    els.push(h("p", { class: "panelLabel" }, "在坏版本上"));
    els.push(h("ul", { class: "tests" }, mutants.map((m, i) => h("li", { class: m.caught ? "ok" : "no" },
      h("span", { class: "m" }, m.caught ? "✓" : "✗"),
      h("div", {}, h("div", {}, `坏版本 ${i + 1}：${m.caught ? "抓住了" : "没抓住"}`),
        m.caught ? h("div", { class: "detail" }, m.by.length ? `失败的测试：${m.by.join("、")}` : "代码直接报错了")
          : h("div", { class: "detail" }, `线索：${m.note}。想一个能区分正确版本和它的输入，再写一个测试。`))))));
  }
  return els;
}
function viewTestwrite(work, item, ctx) {
  const r = rec(item.id);
  work.append(h("p", { class: "panelLabel" }, "被测函数（正确版本）"), codeBlock(item.impl, "py"),
    h("p", { class: "note" }, `另外还有 ${item.mutants.length} 个悄悄改坏的版本，你看不到。好的测试要在正确版本上全部通过，并且每个坏版本都至少让一个测试失败。`),
    h("p", { class: "panelLabel" }, "你的测试（每个 test_ 开头的函数是一个测试，用 assert 检查）"));
  const host = h("div", { class: "editorWrap" });
  work.append(host);
  const out = h("div", { class: "results" });
  const blank = item.starter || "";
  let saveT = null;
  const ed = makeEditor(host, {
    value: r.code !== undefined ? r.code : blank, lang: "py", onRun: () => run(),
    onChange: (v) => { clearTimeout(saveT); saveT = setTimeout(pendingDraft(() => { r.code = v.slice(0, 8000); r.u = Date.now(); save(); }), 800); },
  });
  const runBtn = h("button", { class: "btn primary", onclick: () => run() }, "运行我的测试 ", h("kbd", {}, "Ctrl+Enter"));
  work.append(h("div", { class: "actions" }, runBtn,
    h("button", { class: "btn ghost", onclick: () => { ed.set(blank); out.replaceChildren(); ed.markLines([]); } }, "还原起始代码"),
    h("button", { class: "btn ghost", onclick: () => exportLocal(item, ed.get(), out) }, "复制为本机文件")));
  helpers(work, item, { exam: false, solution: item.solution, onRedo: () => { SESSION.redo[item.id] = true; r.code = blank; r.u = Date.now(); save(); ed.set(blank); out.replaceChildren(); ed.focus(); } });
  work.append(out);
  if (SESSION.results[item.id]) out.append(...testwriteView(SESSION.results[item.id], item, ctx.next));
  async function run() {
    runBtn.disabled = true;
    out.replaceChildren(h("p", { class: "note" }, PY.state !== "ready" ? "正在启动 Python（第一次需要下载约 14 MB 的运行环境，之后就快了）…" : `运行中：正确版本 + ${item.mutants.length} 个坏版本…`));
    const code = ed.get();
    r.code = code.slice(0, 8000);
    const res = await runTestwrite(item, code);
    runBtn.disabled = false;
    SESSION.results[item.id] = res;
    if (!res.onImpl.runtimeError) markAttempt(item, res.pass);
    ed.markLines(res.onImpl.error_line ? [res.onImpl.error_line] : []);
    out.replaceChildren(...testwriteView(res, item, ctx.next));
    refreshHead(work, item);
  }
}

// ---------------------------------------------------------------- exam
function examTitle(day) {
  const w = weekOf(day.id);
  if (Number(day.id) % 7 !== 0) return `第 ${day.id} 天闭卷挑战`;
  return w === 3 ? "毕业大考" : `第 ${w} 周周考`;
}
function renderExam(main, day) {
  const items = examItems(day);
  const e = STATE.exam && Number(STATE.exam.day) === Number(day.id) ? STATE.exam : null;
  const best = STATE.exams[day.id];
  if (!e || !e.active) {
    const panel = h("section", { class: "panel" },
      h("h2", {}, examTitle(day)),
      h("div", { class: "md", html: md(`${items.length} 道「从零手写」题，限时 **${Math.round((items.length * EXAM_MS_PER_ITEM) / 60000)} 分钟**。\n\n- 没有提示、不能看答案、**不能粘贴**\n- 写完一题可以先运行判题，全部通过或时间到就交卷\n- 建议：先把今天的练习做完再来。考不过不丢人，会告诉你明天该复习哪题。`) }),
      best ? h("p", { class: "note" }, `历史最好：${best.best}/${items.length}，上次：${best.last}/${items.length}（${new Date(best.at).toLocaleString()}）`) : "",
      h("div", { class: "actions" }, h("button", { class: "btn primary", onclick: () => {
        STATE.exam = { day: Number(day.id), active: true, startedAt: Date.now(), ms: items.length * EXAM_MS_PER_ITEM };
        for (const it of items) { SESSION.redo[it.id] = true; const r = rec(it.id); delete r.code; delete SESSION.results[it.id]; }
        save(); render();
      } }, best ? "再考一次" : "开始闭卷")));
    main.append(panel);
    if (best) renderPractice(main, day, items, "exam");
    return;
  }
  const clock = h("span", { class: "clock" }, "--:--");
  const bar = h("div", { class: "examBar" }, h("strong", {}, "闭卷进行中"), clock, h("span", { class: "note" }, "提示、答案、粘贴都已关闭"), h("div", { class: "spacer" }), h("button", { class: "btn", onclick: () => finishExam("交卷") }, "交卷"));
  main.append(bar);
  renderPractice(main, day, items, "exam");
  const tick = () => {
    if (!STATE.exam || !STATE.exam.active) return;
    const left = STATE.exam.startedAt + STATE.exam.ms - Date.now();
    if (left <= 0) { finishExam("时间到"); return; }
    clock.textContent = `${String(Math.floor(left / 60000)).padStart(2, "0")}:${String(Math.floor((left % 60000) / 1000)).padStart(2, "0")}`;
    examTick = setTimeout(tick, 1000);
  };
  clearTimeout(examTick);
  tick();
}
let examTick = null;
function examCheck() {
  if (!STATE.exam || !STATE.exam.active) return;
  const items = examItems(dayOf(STATE.exam.day));
  if (items.every((it) => SESSION.results[it.id] && isPass(SESSION.results[it.id]))) finishExam("全部通过");
}
function finishExam(reason) {
  if (!STATE.exam || !STATE.exam.active) return;
  const day = STATE.exam.day;
  const items = examItems(dayOf(day));
  const score = items.filter((it) => SESSION.results[it.id] && isPass(SESSION.results[it.id])).length;
  const prev = STATE.exams[day] || {};
  STATE.exams[day] = { best: Math.max(prev.best || 0, score), last: score, at: Date.now(), tries: (prev.tries || 0) + 1, minutes: Math.round((Date.now() - STATE.exam.startedAt) / 60000) };
  for (const it of items) if (!(SESSION.results[it.id] && isPass(SESSION.results[it.id]))) { const r = rec(it.id); r.review = true; r.u = Date.now(); }
  STATE.exam = null;
  clearTimeout(examTick);
  save();
  toast(`${reason}：${score}/${items.length}`);
  render();
}

// ---------------------------------------------------------------- review + stats
function renderReview(main) {
  const items = ALL_ITEMS.filter((it) => STATE.items[it.id]?.review);
  main.append(h("section", { class: "panel" },
    h("h2", {}, "复习区"),
    h("div", { class: "md", html: md("这里是需要**独立重做一次**的题：看过答案的、用了 2 个以上提示的、提交很多次才过的、闭卷没做出来的。\n\n点开题目 →「从空白重做」→ 不看答案写对，它就会离开这里。每天开始新内容之前，先把这里清空。") })));
  if (!items.length) { main.append(h("div", { class: "panel" }, h("p", { class: "emptyNote" }, "复习区是空的。保持住：做完一题后，隔一天再从空白写一遍，最能检验是不是真会了。"))); return; }
  renderPractice(main, null, items, "review");
}
function renderStats(main) {
  const solved = ALL_ITEMS.filter((it) => STATE.items[it.id]?.s === "solved");
  const mastered = solved.filter((it) => !STATE.items[it.id].review);
  const hints = Object.values(STATE.items).reduce((n, r) => n + (r.h || 0), 0);
  const sols = Object.values(STATE.items).filter((r) => r.sol).length;
  const stuck = ALL_ITEMS.filter((it) => { const r = STATE.items[it.id]; return r && r.s !== "solved" && r.a >= 3; });
  main.append(h("section", { class: "panel" },
    h("h2", {}, "我的进度"),
    h("div", { class: "statGrid" },
      h("div", { class: "stat" }, h("b", {}, mastered.length), h("span", {}, "已掌握（通过且不在复习区）")),
      h("div", { class: "stat" }, h("b", {}, `${solved.length}/${ALL_ITEMS.length}`), h("span", {}, "已通过")),
      h("div", { class: "stat" }, h("b", {}, ALL_ITEMS.filter((it) => STATE.items[it.id]?.review).length), h("span", {}, "复习区")),
      h("div", { class: "stat" }, h("b", {}, hints), h("span", {}, "用过的提示")),
      h("div", { class: "stat" }, h("b", {}, sols), h("span", {}, "看过答案的题"))),
    h("div", { class: "tableWrap" }, h("table", { class: "dayTable" },
      h("thead", {}, h("tr", {}, h("th", {}, "天"), h("th", {}, "主题"), h("th", {}, "通过"), h("th", {}, "掌握"), h("th", {}, "闭卷最好"))),
      h("tbody", {}, COURSE.days.map((d) => {
        const p = dayProgress(d);
        const m = d.items.filter((it) => STATE.items[it.id]?.s === "solved" && !STATE.items[it.id].review).length;
        const e = STATE.exams[d.id];
        return h("tr", {}, h("td", {}, d.id), h("td", {}, d.title), h("td", {}, `${p.done}/${p.total}`), h("td", {}, `${m}/${p.total}`), h("td", {}, e ? `${e.best}/${examItems(d).length}` : "—"));
      })))),
    stuck.length ? h("div", { class: "md", html: md("**卡住的题**（提交 3 次以上还没通过）：" + stuck.map((it) => `第 ${it.day} 天「${it.title}」`).join("、") + "。先休息一下，读一遍相关的知识卡片再回来。") }) : "",
    h("p", { class: "note" }, CLOUD.ready ? "进度已同步到这个页面的数据库：回到和 Claude 的对话里说「看看我的进度」，它能读到你每道题的情况。" : "进度保存在这个浏览器里。")));
}

// ---------------------------------------------------------------- boot
load();
$("#allowPaste").checked = !!STATE.settings.allowPaste;
$("#allowPaste").addEventListener("change", (e) => { STATE.settings.allowPaste = e.target.checked; save(); toast(e.target.checked ? "已允许粘贴" : "已关闭粘贴：手敲记得更牢"); });
if (STATE.exam && STATE.exam.active) for (const it of examItems(dayOf(STATE.exam.day) || { items: [] })) SESSION.redo[it.id] = false;
pySetChip(); tsSetChip();
render();
initCloud();
</script>
